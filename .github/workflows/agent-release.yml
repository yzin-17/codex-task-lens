name: Lightweight agent packages
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'packaging/agent/**'
      - 'scripts/build-agent.mjs'
      - 'scripts/package-agent.mjs'
      - 'scripts/smoke-agent-package.mjs'
      - 'scripts/validate-agent-release.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-release.yml'
permissions:
  contents: read
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.20.0', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build:agent
      - run: node dist/agent/node/cli/index.mjs --help
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            report: darwin-arm64
          - os: windows-latest
            target: windows
            report: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:agent -- --${{ matrix.target }}
      - name: Smoke direct launcher
        env:
          TASK_LENS_SMOKE_OUTPUT: release/agent-smoke-${{ matrix.report }}.json
        run: pnpm test:agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: |
            release/Codex-Task-Lens-*-${{ matrix.target }}.zip
            release/agent-smoke-${{ matrix.report }}.json
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [verify, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: artifacts
          merge-multiple: true
      - run: node scripts/validate-agent-release.mjs artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          test "$GITHUB_REF_NAME" = "v$version"
          if gh release view "v$version" >/dev/null 2>&1; then echo 'Release exists; refusing to overwrite assets'; exit 1; fi
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "v$version" artifacts/Codex-Task-Lens-*.zip --target "$GITHUB_SHA" "${release_flags[@]}" --title "Codex Task Lens $version" --notes-file "docs/releases/$version.md"
