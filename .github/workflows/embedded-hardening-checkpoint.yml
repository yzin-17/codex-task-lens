name: Embedded hardening checkpoint
on:
  push:
    branches: [feat/codex-embedded-runtime]
    paths: [.github/workflows/embedded-hardening-checkpoint.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-embedded-runtime
      - name: Apply bounded source hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, old, new):
              p = Path(file)
              text = p.read_text()
              assert text.count(old) == 1, (file, old, text.count(old))
              p.write_text(text.replace(old, new))
          replace('src/platform/macos/codex-app.ts',
              '  const targets = (await list(port)).filter(value => isCodexTarget(value, port));',
              "  await run('/usr/bin/codesign', ['--verify', '--strict', '--test-requirement', requirement, app.executable]);\n  const targets = (await list(port)).filter(value => isCodexTarget(value, port));")
          replace('src/adapters/codex/session-records/index.ts',
              "import { open, opendir, realpath } from 'node:fs/promises';",
              "import { open, opendir, realpath, lstat } from 'node:fs/promises';")
          replace('src/adapters/codex/session-records/index.ts',
              'const candidates = this.files.filter(file => path.basename(file).includes(threadId)).slice(0, 8); const valid: State[] = [];',
              "const candidates = this.files.filter(file => path.basename(file).includes(threadId));\n    if (candidates.length > 8) return { status: 'unsupported', paths: [], diagnostics: ['匹配记录过多，未用截断结果判断唯一会话'] };\n    const valid: State[] = []; let hasUnread = false;")
          replace('src/adapters/codex/session-records/index.ts',
              'if (!resolved || !inside(this.root, resolved)) continue;',
              'if (!resolved || resolved !== file || !inside(this.root, resolved)) continue;')
          replace('src/adapters/codex/session-records/index.ts',
              'const stat = await handle.stat(); if (!stat.isFile()) continue;',
              'const stat = await handle.stat(), disk = await lstat(file);\n        if (!stat.isFile() || !disk.isFile() || await realpath(file) !== resolved || stat.ino !== disk.ino || stat.dev !== disk.dev) continue;')
          replace('src/adapters/codex/session-records/index.ts',
              'state.mtime = stat.mtimeMs; this.states.set(file, state);',
              'hasUnread ||= state.offset < stat.size;\n        state.mtime = stat.mtimeMs; this.states.set(file, state);')
          replace('src/adapters/codex/session-records/index.ts',
              "...(this.partial ? ['会话索引结果不完整'] : [])",
              "...(this.partial ? ['会话索引结果不完整'] : []), ...(hasUnread ? ['会话记录增量读取尚未完成，重新查找可继续读取'] : [])")
          replace('src/discovery/candidates.ts',
              '  const check=()=>signal?.throwIfAborted();',
              '  for(const diagnostic of hints?.diagnostics.slice(0,20)??[])diagnostics.add(diagnostic);\n  const check=()=>signal?.throwIfAborted();')
          replace('src/ui/components/binding-picker/binding-picker.tsx',
              '  async function save(clear = false) {',
              "  useEffect(() => {\n    if (initialGrantId) {\n      setGrantId(initialGrantId);\n      void run(signal => api.call('listCandidates', { grantId: initialGrantId }, signal), setCandidates);\n    }\n  }, [api, initialGrantId]);\n  async function save(clear = false) {")
          PY
      - name: Commit only the targeted source files
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/platform/macos/codex-app.ts src/adapters/codex/session-records/index.ts src/discovery/candidates.ts src/ui/components/binding-picker/binding-picker.tsx
          git commit -m 'fix: harden session reads, revalidate signer and discover authorized candidates automatically'
          git push origin HEAD:refs/heads/feat/codex-embedded-runtime
