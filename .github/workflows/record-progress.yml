# One-time documentation checkpoint on the implementation branch; removed after use.
name: Record verified implementation progress
on:
  push:
    branches: [feat/standalone-document-flow]
    paths: [.github/workflows/record-progress.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standalone-document-flow
      - name: Update only the existing task ledger and specification
        shell: python
        run: |
          import pathlib, re, subprocess
          task = pathlib.Path('docs/tasks/task-lens-mvp.md')
          spec = pathlib.Path('docs/specs/2026-09-26-task-lens-mvp.md')
          assert subprocess.check_output(['git','hash-object',str(task)], text=True).strip() == 'e9a9c8800d2e5999036e6ac92fe9d80d4816cfb8', 'Task changed; stop for reconciliation'
          assert subprocess.check_output(['git','hash-object',str(spec)], text=True).strip() == '151ffea650321863a0019b006979959dc6367438', 'Spec changed; stop for reconciliation'
          source = task.read_text()
          completed = {'T01','T03','T04','T05','T06','T07','T09','T13','T14','T15','T16','T17','I1'}
          ids = re.findall(r'^- \[ \] ((?:T\d+|I\d+|R\d+))：', source, re.M)
          assert len(ids) == 23 and len(set(ids)) == 23 and completed <= set(ids)
          source, count = re.subn(r'^> 状态：.*$', '> 状态：独立文档监控链路已实现并通过 I1；当前 13 / 23。Codex 内嵌接入、I2 与 R1 未完成；不代表一期整体通过。', source, count=1, flags=re.M)
          assert count == 1
          source = source.replace('所有本项目实现与验收仍未完成。', '用户环境的版本／脱敏结构尚未补齐；已完成的独立能力与未完成的宿主适配分别记录。', 1)
          source = source.replace('下列代码路径是计划创建的位置，当前不存在；', '已完成任务的路径已经落地；其余路径仍是计划创建的位置；', 1)
          source = source.replace('基础与相应实现任务建立以下入口；本次文档提交不创建脚本或 CI：', '基础测试、构建与独立入口已建立；表中 CDP／doctor／test:mac 仍为后续任务要求，不得作为现有可用命令：', 1)
          source = source.replace('| `pnpm start -- --standalone`、`pnpm start -- --cdp-port 9341`、`pnpm doctor` | T20 建立构建后运行与诊断入口 |', '| `pnpm start -- --standalone` | T17 已建立构建后独立入口 |\n| `pnpm start -- --cdp-port 9341`、`pnpm doctor` | T20 待建立，当前不可用 |')
          source = source.replace('`src/core/task-parser.ts`、`src/core/task-scope.ts`、`tests/unit/task-parser.test.ts`、`tests/fixtures/markdown/**`', '`src/core/task-parser.ts`、`src/core/task-scope.ts`、`src/core/task-budget.ts`、`tests/unit/task-parser.test.ts`、`tests/unit/task-scope-limits.test.ts`、`tests/unit/task-budget.test.ts`、`tests/fixtures/markdown/**`', 1)
          source = source.replace('`tests/fixtures/ui/task-panel/**`', '`tests/fixtures/ui/main.tsx`、`tests/fixtures/ui/index.html`')
          source = source.replace('`tests/fixtures/ui/binding-picker/**`', '`tests/fixtures/ui/picker*`、`src/ui/client.ts`')
          blocked = {
            'T02': '阻塞：缺少已授权用户 Mac 的版本与脱敏 DOM／会话结构；见 [兼容交接](../compatibility/macos.md)。不重新论证可行性。',
            'T08': '未实现；等待 T02 的真实会话格式基线，不用 unavailable 伪装完成。',
            'T10': '未实现；等待 T02 的真实应用／进程／端点基线。T14 的 open-source.ts 不是 CDP 启动器。',
            'T11': '未实现；等待 T10 的可信端点契约。',
            'T12': '未实现；等待 T02 的实际 DOM 基线，不猜选择器。',
            'T18': '未实现；等待 T11／T12。',
            'T19': '未实现；等待 T12。当前注入构建仅为显式 not_implemented 占位。',
            'T20': '未完成；T17 已提供独立运行入口，但 CDP 组合与 doctor 仍未实现。',
            'I2': '未执行；没有已授权用户 Mac 的完整产品接入。托管 macOS 核心 CI 不替代本门禁。',
            'R1': '未通过；一期仍有必要能力与 I2 缺失，本次局部检查不兑换为最终 Review。'
          }
          for identifier in ids:
            pattern = r'^- \[ \] ' + re.escape(identifier) + r'：([^\n]+)$'
            if identifier in completed:
              record = f'已完成；代码基线 06e8c234；真实命令、环境与断言见 [{identifier} 验证](../validation/task-lens-mvp/{identifier}.md)。'
              replacement = f'- [x] {identifier}：' + r'\1' + '\n  - 执行记录：' + record
            else:
              replacement = f'- [ ] {identifier}：' + r'\1' + '\n  - 执行记录：' + blocked[identifier]
            source, count = re.subn(pattern, replacement, source, count=1, flags=re.M)
            assert count == 1, identifier
          checkpoint = '2026-09-26：实现独立文件闭环并通过 I1；全量 Linux／托管 macOS 核心 CI 与 Linux 浏览器检查通过。13 个已完成项均链接单项证据，另 10 项保留未完成及依赖。详见 [验证索引](../validation/task-lens-mvp/README.md)。构建／fixture／补充回归路径由整合者串行维护，没有让 worker 并发覆盖共享文件。\n\n'
          assert source.count('后续按任务写入真实状态') == 1
          source = source.replace('后续按任务写入真实状态', checkpoint + '后续按任务写入真实状态', 1)
          task.write_text(source)
          text = spec.read_text()
          anchor = '性能验收目标（不是既有测量）：'
          assert text.count(anchor) == 1
          addition = '实现补充的防放大边界：源文档最多 50,000 行、10,000 个标题、单标题 512 字符；标题展开元数据最多约 4 MiB、解析任务数据最多约 8 MiB；嵌套深度最多 64 层。超限必须明确报告 unsupported，不静默截断任务。重放缓存同时限制条目数与约 8 MiB 序列化大小，预览票据只保存元数据；这些是安全资源上限，不是性能验收通过证据。\n\n'
          spec.write_text(text.replace(anchor, addition + anchor, 1))
          entries = re.findall(r'^- \[([ x])\] ((?:T\d+|I\d+|R\d+))：', source, re.M)
          assert len(entries) == 23 and {i for state,i in entries if state == 'x'} == completed
          for i in completed:
            assert pathlib.Path(f'docs/validation/task-lens-mvp/{i}.md').is_file()
          checked = 0
          for file in [pathlib.Path('README.md'), *pathlib.Path('docs').rglob('*.md')]:
            content = re.sub(r'```.*?```', '', file.read_text(), flags=re.S)
            for link in re.findall(r'\]\(([^)]+)\)', content):
              if re.match(r'^(https?://|mailto:|#)', link): continue
              target = link.split('#',1)[0]
              if not target: continue
              assert (file.parent / target).exists(), f'Broken relative file link: {file}: {link}'
              checked += 1
          subprocess.run(['git','diff','--check'], check=True)
          print(f'Documentation checkpoint: {len(completed)}/23; {checked} relative file targets exist; task IDs preserved. Heading anchors were not revalidated.')
      - name: Commit the documentation checkpoint without modifying main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasks/task-lens-mvp.md docs/specs/2026-09-26-task-lens-mvp.md
          git commit -m 'docs: record 13 verified tasks and retain blocked Mac acceptance'
          git push origin HEAD:feat/standalone-document-flow
