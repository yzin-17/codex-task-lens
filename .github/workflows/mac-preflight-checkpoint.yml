name: Transfer verified Mac preflight
on:
  push:
    branches: ['feat/codex-embedded-runtime']
    paths: ['.github/workflows/mac-preflight-checkpoint.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.repository == 'yzin-17/codex-task-lens' && github.ref == 'refs/heads/feat/codex-embedded-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Reproduce only the locally tested trees and preserve their commit identities
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          def git(*args, data=None, env=None):
              return subprocess.check_output(['git', *args], input=data, env=env).decode().strip()
          base = 'f246f8e9e34d63af5dc1db2ad9aa1325ebfdaadc'
          checkpoint = git('rev-parse', 'HEAD')
          assert git('rev-parse', 'HEAD^') == base, 'Unexpected base; do not overwrite concurrent work'
          workflow = '.github/workflows/mac-preflight-checkpoint.yml'
          assert git('diff', '--name-only', base, checkpoint) == workflow
          git('rm', workflow)
          def replace(name, old, new, count=1):
              file = Path(name)
              text = file.read_text()
              assert text.count(old) == count, (name, old, text.count(old))
              file.write_text(text.replace(old, new))
          counts = {'README.md':1,'src/cli/index.ts':2,'src/cli/mac-acceptance.ts':1,'docs/development.md':1,'docs/compatibility/macos.md':1,'docs/specs/2026-09-26-task-lens-mvp.md':1,'docs/tasks/task-lens-mvp.md':2,'docs/validation/task-lens-mvp/I2.md':1}
          for name, count in counts.items():
              replace(name, 'pnpm doctor', 'pnpm run doctor', count)
          replace('playwright.config.ts', "command: 'pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort'", 'command: `${JSON.stringify(process.execPath)} node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort`')
          replace('playwright.config.ts', "command: 'pnpm exec vite --config vite.fixtures.config.ts'", 'command: `${JSON.stringify(process.execPath)} node_modules/vite/bin/vite.js --config vite.fixtures.config.ts`')
          replace('tests/integration/document-stream.test.ts', "const s=await stream();await chmod(file,0o000);await s.refreshNow();expect(s.snapshot()).toMatchObject({status:'permission_denied',cached:true});", "const s=await stream();await chmod(file,0o000);await s.refreshNow();\n    // An already-open read may first report unstable after chmod changes ctime.\n    await expect.poll(()=>s.snapshot()).toMatchObject({status:'permission_denied',cached:true,tasks:{total:1}});")
          replace('tests/integration/document-stream.test.ts', "await chmod(file,0o600);await writeFile(file,'x'.repeat(2*1024*1024+1));await s.refreshNow();expect(s.snapshot()).toMatchObject({status:'unsupported',cached:true});", "await chmod(file,0o600);await writeFile(file,'x'.repeat(2*1024*1024+1));await s.refreshNow();\n    await expect.poll(()=>s.snapshot()).toMatchObject({status:'unsupported',cached:true,tasks:{total:1}});")
          Path('tests/standalone/doctor-entry.spec.ts').write_text('''import { test, expect } from '@playwright/test';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';

          // Exercise package-manager dispatch, not only the compiled CLI: pnpm owns "doctor".
          test('documented doctor command invokes the project script and forwards arguments', async () => {
            const execute = promisify(execFile);
            const options = { timeout: 10000, maxBuffer: 512 * 1024 };
            const help = await execute('corepack', ['pnpm', 'run', 'doctor', '--', '--help'], options);
            expect(help.stdout).toContain('Codex Task Lens');
            expect(help.stdout).toContain('pnpm run doctor');
            expect(help.stdout).not.toContain('Checks for known common issues');
            await expect(execute('corepack', ['pnpm', 'run', 'doctor', '--', '--invalid-task-lens-test-flag'], options))
              .rejects.toMatchObject({ code: 1, stderr: expect.stringContaining('不支持的参数') });
          });
          ''')
          git('add', '--', *counts.keys(), 'playwright.config.ts', 'tests/integration/document-stream.test.ts', 'tests/standalone/doctor-entry.spec.ts')
          assert git('write-tree') == 'ad5c27b99430f6ba4d0ae22423848532f66337d2', 'Code differs from Mac-tested tree'
          first = git('hash-object', '-t', 'commit', '-w', '--stdin', data=base64.b64decode(''))
          assert first == '5cc859b4d77cc45f98ba707d82cb69783aef8a36'
          Path('docs/validation/task-lens-mvp/mac-preflight-2026-09-26.md').write_text('''# 实际 Mac 预检：2026-09-26

          通过已授权的 Remote Desktop Commander 在用户 Mac 上执行，不是托管 runner。受测代码：`5cc859b4d77cc45f98ba707d82cb69783aef8a36`。

          | 项目 | 实际结果 |
          | --- | --- |
          | macOS／架构 | 26.6.2（25G83）／arm64 |
          | Node／项目 pnpm | 24.18.0／10.28.2（通过 Corepack；未修改系统全局版本） |
          | Codex | 26.924.22138；`com.openai.codex`；`/Applications/ChatGPT.app` |
          | 应用身份 | 实际调用 `inspectApp`，应用包和可执行文件签名校验通过 |
          | CDP | 当前主进程无调试参数、无 TCP 监听；指定端口 9341 无监听 |
          | 项目诊断 | `corepack pnpm run doctor -- --cdp-port 9341` 明确报告没有 CDP 监听，退出码 1 |

          ## 本机执行与修复

          冻结安装成功；`corepack pnpm lint`、`corepack pnpm typecheck`、`corepack pnpm exec vitest run --maxWorkers=2`（29 个文件／103 项）、`corepack pnpm build` 全部通过。

          `corepack pnpm exec playwright test tests/standalone/doctor-entry.spec.ts --workers=1 --reporter=list`：1 项命令入口回归通过；该用例不启动浏览器，未把它记成全量浏览器或 Codex UI 验收。

          1. 原 `pnpm doctor` 命中了 pnpm 内建命令，没有运行项目诊断；运行说明、帮助和错误提示已改为 `pnpm run doctor`，回归直接验证包管理器脚本分发和参数传递。
          2. Playwright webServer 原本再次查找系统 `pnpm`，在当前 Volta 11.9.0／Corepack 10.28.2 组合下失败；改为当前 Node 直接执行项目 Vite，不修改全局工具、不放宽版本约束。
          3. 一次全量复跑暴露文件权限测试时序问题：`chmod` 与已有读取交错，先合法产生 `unstable`，再异步产生权限错误。测试改为等待最终状态，并额外断言缓存任务总数仍为 1；未改产品行为、未增重试或固定睡眠。修正后完整核心套件通过。

          参考：[pnpm 10 doctor](https://pnpm.io/10.x/cli/doctor)、[pnpm run 同名命令规则](https://pnpm.io/10.x/cli/run)。

          ## 剩余边界

          尚未采集真实 Codex DOM、A/B 切换、会话路径结构或内嵌更新时延；未读取认证文件或对话正文，未强退、重启或注入当前 Codex。普通启动没有 CDP，不能执行 I2。需用户在任务结束后正常退出并调试启动，再继续原验收场景。

          [T02 兼容基线](../../compatibility/macos.md) 仅补齐版本／应用身份；[I2](I2.md) 与 [R1](R1.md) 仍未通过。正式台账维持 **20 / 23**，不以预检或新增回归数增加完成项。
          ''')
          replace('docs/tasks/task-lens-mvp.md', '执行记录：阻塞：缺少已授权用户 Mac 的版本与脱敏 DOM／会话结构；见 [兼容交接](../compatibility/macos.md)。不重新论证可行性。', '执行记录：已连接用户授权 Mac，补录实际版本与应用签名；当前运行实例未开放 CDP，DOM／A-B 切换及会话结构尚未采集。见 [本机预检](../validation/task-lens-mvp/mac-preflight-2026-09-26.md)，保持未勾选。')
          file = Path('docs/tasks/task-lens-mvp.md')
          file.write_text(file.read_text() + '\n2026-09-26：通过 Remote Desktop Commander 完成本机安装、签名检查与核心回归，修正诊断命令分发和测试启动／异步断言问题。当前 Codex 普通启动未开放 CDP，未强退或重启；T02 部分补录，I2／R1 保持未通过。见 [实际 Mac 预检](../validation/task-lens-mvp/mac-preflight-2026-09-26.md)。\n')
          replace('docs/compatibility/macos.md', '## 补录真实基线', '## 2026-09-26 实际 Mac 预检\n\n已通过授权远程连接确认：macOS 26.6.2（25G83）／arm64、Node 24.18.0、项目 pnpm 10.28.2，实际应用为 `/Applications/ChatGPT.app`，Codex 26.924.22138／`com.openai.codex`，应用与可执行文件签名通过。本次实例未开放 CDP，尚不能采集 DOM 和执行 I2。完整命令、结果及修复见 [本机预检](../validation/task-lens-mvp/mac-preflight-2026-09-26.md)。这仅补录 T02 的环境部分，不宣称该 Codex 版本已完成适配验收。\n\n## 补录真实基线')
          replace('docs/validation/task-lens-mvp/README.md', '当前代码基线', '此前内嵌阶段代码基线')
          file = Path('docs/validation/task-lens-mvp/README.md')
          file.write_text(file.read_text() + '\n## 后续实际 Mac 预检\n\n[2026-09-26 本机记录](mac-preflight-2026-09-26.md)：已连通授权设备并验证安装、103 项核心测试、构建与诊断命令入口。普通启动的 Codex 无 CDP 监听，未开展内嵌真机验收；不改变 20 / 23。\n')
          git('add', '--', 'docs/compatibility/macos.md', 'docs/tasks/task-lens-mvp.md', 'docs/validation/task-lens-mvp/README.md', 'docs/validation/task-lens-mvp/mac-preflight-2026-09-26.md')
          tree = git('write-tree')
          assert tree == '6aa36dd34e379875ae9ee06708d3f47d75e73d40', 'Docs differ from verified local tree'
          second = git('hash-object', '-t', 'commit', '-w', '--stdin', data=base64.b64decode(''))
          assert second == '4bc09657bdfc5488e3c5fbcc079686b6c5cfbe7c'
          git('diff', '--cached', '--check')
          env = os.environ.copy()
          env.update(GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]', GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com', GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          final = git('commit-tree', tree, '-p', checkpoint, '-p', second, '-m', 'fix: import verified Mac preflight commits and remove transfer workflow', env=env)
          git('push', 'origin', final + ':refs/heads/feat/codex-embedded-runtime')
          print('Imported exact local commits; final tree:', tree, 'remote head:', final)
          PY
