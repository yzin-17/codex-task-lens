name: Complete exact Mac checkpoint
on:
  push:
    branches: ['feat/codex-embedded-runtime']
    paths: ['.github/workflows/mac-preflight-checkpoint-retry.yml']
permissions:
  contents: read
jobs:
  checkpoint-retry:
    if: github.repository == 'yzin-17/codex-task-lens' && github.ref == 'refs/heads/feat/codex-embedded-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Retry exact-tree import and remove both temporary workflows
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          prior = subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert prior == '3bc794c960be907b3f10b50f7f5ccb8e48e32659'
          original = '.github/workflows/mac-preflight-checkpoint.yml'
          retry = '.github/workflows/mac-preflight-checkpoint-retry.yml'
          text = Path(original).read_text()
          lines = text.split("          python3 - <<'PY'\n",1)[1].rsplit('          PY',1)[0].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          old = "assert git('rev-parse', 'HEAD^') == base"
          assert script.count(old) == 1
          script = script.replace(old,"assert git('rev-parse', 'HEAD~2') == base")
          old = "assert git('diff', '--name-only', base, checkpoint) == workflow"
          assert script.count(old) == 1
          script = script.replace(old,"assert set(git('diff', '--name-only', base, checkpoint).splitlines()) == {workflow, '.github/workflows/mac-preflight-checkpoint-retry.yml'}")
          script = script.replace("git('rm', workflow)","git('rm', workflow, '.github/workflows/mac-preflight-checkpoint-retry.yml')",1)
          old = "replace('docs/validation/task-lens-mvp/README.md', '当前代码基线', '此前内嵌阶段代码基线')"
          assert script.count(old) == 1
          script = script.replace(old,"file = Path('docs/validation/task-lens-mvp/README.md'); file.write_text(file.read_text().replace('当前代码基线', '此前内嵌阶段代码基线', 1))")
          # The original mandatory code/tree and raw-commit SHA checks remain unchanged.
          exec(compile(script, '<verified-mac-checkpoint>', 'exec'))
          PY
