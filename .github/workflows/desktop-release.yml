name: Legacy Electron packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'tools/desktop/**', 'electron-builder.cjs', '.github/workflows/desktop-release.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:desktop && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix tools/desktop --ignore-scripts
      - run: pnpm typecheck && pnpm test:desktop && pnpm build
      - run: node scripts/generate-icons.mjs
      - name: Build self-contained desktop packages
        run: pnpm build:desktop -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Start the packaged app without Node or pnpm in PATH
        run: pnpm test:package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/packaged-smoke-*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-diagnostics-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/packaged-smoke-*.json
            release/builder-debug.yml
            release/builder-effective-config.yaml
          retention-days: 7
